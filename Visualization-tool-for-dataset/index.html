<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Data Visualizer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Training Data Visualizer</h1>
      <p>Upload one or more JSON files to verify the stroke data.</p>

      <label class="upload-btn">
        + Add Files
        <input type="file" id="fileInput" accept=".json" multiple />
      </label>

      <button
        id="resetBtn"
        class="reset-btn"
        style="display: none; margin-left: 16px"
      >
        ⟲ Reset
      </button>

      <p id="emptyMsg" class="empty-msg">
        No files loaded yet. Upload JSON files above.
      </p>

      <div id="gallery" class="gallery"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
